kind = "mobile"
previewPath = "/"
title = "Secret Diary"
version = "1.0.0"
id = "artifacts/secret-diary"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21996

[services.development]
run = "pnpm --filter @workspace/secret-diary run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/secret-diary", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/secret-diary", "run", "serve" ]

[services.env]
PORT = "21996"
BASE_PATH = "/"
